<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI IDE Agent</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        main {
            flex: 1;
            display: flex;
            gap: 1rem;
            padding: 1rem;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        .sidebar {
            width: 300px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-section {
            margin-bottom: 1.5rem;
        }

        .sidebar-title {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .feature-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feature-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }

        .feature-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
        }

        .chat-container {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 1rem;
            border-radius: 12px;
            line-height: 1.6;
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 4px;
        }

        .message-code {
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            overflow-x: auto;
            margin-top: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-input-container {
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #chat-input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        #chat-input:focus {
            border-color: #667eea;
        }

        #chat-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .send-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 1rem;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        .welcome-message {
            text-align: center;
            padding: 3rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .welcome-message h2 {
            margin-bottom: 1rem;
            color: white;
        }

        .suggestion-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 1.5rem;
        }

        .chip {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .chip:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #667eea;
        }

        @media (max-width: 768px) {
            main {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .message {
                max-width: 95%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon">🤖</div>
            <span>AI IDE Agent</span>
        </div>
        <div class="status-indicator">
            <div class="status-dot"></div>
            <span>Powered by Puter.js v2</span>
        </div>
    </header>

    <main>
        <aside class="sidebar">
            <div class="sidebar-section">
                <h3 class="sidebar-title">Capabilities</h3>
                <button class="feature-btn active" onclick="setMode('code')">
                    <span>💻</span> Code Generation
                </button>
                <button class="feature-btn" onclick="setMode('debug')">
                    <span>🐛</span> Debugging Help
                </button>
                <button class="feature-btn" onclick="setMode('explain')">
                    <span>📚</span> Code Explanation
                </button>
                <button class="feature-btn" onclick="setMode('refactor')">
                    <span>✨</span> Code Refactoring
                </button>
                <button class="feature-btn" onclick="setMode('optimize')">
                    <span>⚡</span> Performance Optimization
                </button>
            </div>

            <div class="sidebar-section">
                <h3 class="sidebar-title">Quick Actions</h3>
                <button class="feature-btn" onclick="clearChat()">
                    <span>🗑️</span> Clear Chat
                </button>
                <button class="feature-btn" onclick="copyLastResponse()">
                    <span>📋</span> Copy Last Response
                </button>
            </div>
        </aside>

        <div class="chat-container">
            <div class="chat-messages" id="chat-messages">
                <div class="welcome-message">
                    <h2>Welcome to AI IDE Agent! 👋</h2>
                    <p>I'm your intelligent coding assistant powered by Puter.js v2.</p>
                    <p>I can help you write, debug, explain, and optimize code.</p>
                    <div class="suggestion-chips">
                        <div class="chip" onclick="useSuggestion('Create a Python function to sort a list of dictionaries by a specific key')">Create a sorting function</div>
                        <div class="chip" onclick="useSuggestion('Explain how async/await works in JavaScript')">Explain async/await</div>
                        <div class="chip" onclick="useSuggestion('Help me debug this error: TypeError: Cannot read property of undefined')">Debug an error</div>
                        <div class="chip" onclick="useSuggestion('Optimize this database query for better performance')">Optimize code</div>
                    </div>
                </div>
            </div>

            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <input 
                        type="text" 
                        id="chat-input" 
                        placeholder="Ask me anything about coding..." 
                        autocomplete="off"
                    >
                    <button class="send-btn" id="send-btn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentMode = 'code';
        let lastResponse = '';

        // Initialize Puter AI
        async function initPuter() {
            try {
                await puter.ai.chat('Hello! You are now an expert AI IDE assistant. You help developers with coding tasks including writing code, debugging, explaining concepts, refactoring, and optimization. Always provide clear, concise, and accurate responses. When showing code, use proper formatting.');
                console.log('Puter AI initialized successfully');
            } catch (error) {
                console.error('Error initializing Puter AI:', error);
                addMessage('ai', '⚠️ Having trouble connecting to Puter AI. Please check your connection and try again.');
            }
        }

        // Set conversation mode
        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.feature-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            const modeMessages = {
                'code': 'Ready to generate code! What would you like me to create?',
                'debug': 'Debugging mode activated! Share the error or issue you\'re facing.',
                'explain': 'Explanation mode on! Which code or concept should I explain?',
                'refactor': 'Refactoring mode! Paste the code you\'d like me to improve.',
                'optimize': 'Optimization mode! Show me the code you want to make faster.'
            };
            
            addMessage('ai', modeMessages[mode]);
        }

        // Add message to chat
        function addMessage(sender, content, isCode = false) {
            const messagesContainer = document.getElementById('chat-messages');
            const welcomeMsg = messagesContainer.querySelector('.welcome-message');
            if (welcomeMsg) {
                welcomeMsg.style.display = 'none';
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            if (isCode) {
                messageDiv.innerHTML = `<div>${content}</div><pre class="message-code">${escapeHtml(content)}</pre>`;
            } else {
                messageDiv.textContent = content;
            }
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            if (sender === 'ai') {
                lastResponse = content;
            }
        }

        // Show typing indicator
        function showTypingIndicator() {
            const messagesContainer = document.getElementById('chat-messages');
            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator';
            indicator.id = 'typing-indicator';
            indicator.innerHTML = `
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            `;
            messagesContainer.appendChild(indicator);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Remove typing indicator
        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) {
                indicator.remove();
            }
        }

        // Escape HTML for code display
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Send message to Puter AI
        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const sendBtn = document.getElementById('send-btn');
            const message = input.value.trim();

            if (!message) return;

            // Add user message
            addMessage('user', message);
            input.value = '';
            sendBtn.disabled = true;

            // Show typing indicator
            showTypingIndicator();

            try {
                // Prepare context based on mode
                let contextMessage = message;
                switch(currentMode) {
                    case 'code':
                        contextMessage = `[Code Generation] ${message}. Please provide clean, well-commented code.`;
                        break;
                    case 'debug':
                        contextMessage = `[Debugging] ${message}. Please analyze the issue and provide a solution.`;
                        break;
                    case 'explain':
                        contextMessage = `[Explanation] ${message}. Please explain clearly with examples if helpful.`;
                        break;
                    case 'refactor':
                        contextMessage = `[Refactoring] ${message}. Please improve the code structure and readability.`;
                        break;
                    case 'optimize':
                        contextMessage = `[Optimization] ${message}. Please suggest performance improvements.`;
                        break;
                }

                // Call Puter AI
                const response = await puter.ai.chat(contextMessage);
                
                removeTypingIndicator();
                
                // Check if response contains code
                const hasCode = response.includes('```');
                addMessage('ai', response, hasCode);

            } catch (error) {
                removeTypingIndicator();
                addMessage('ai', `❌ Error: ${error.message}. Please try again.`);
                console.error('Puter AI error:', error);
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        // Use suggestion chip
        function useSuggestion(text) {
            document.getElementById('chat-input').value = text;
            sendMessage();
        }

        // Clear chat
        function clearChat() {
            const messagesContainer = document.getElementById('chat-messages');
            messagesContainer.innerHTML = `
                <div class="welcome-message">
                    <h2>Chat cleared! 🎉</h2>
                    <p>Ready to start fresh. How can I help you?</p>
                    <div class="suggestion-chips">
                        <div class="chip" onclick="useSuggestion('Create a Python function to sort a list of dictionaries by a specific key')">Create a sorting function</div>
                        <div class="chip" onclick="useSuggestion('Explain how async/await works in JavaScript')">Explain async/await</div>
                        <div class="chip" onclick="useSuggestion('Help me debug this error: TypeError: Cannot read property of undefined')">Debug an error</div>
                        <div class="chip" onclick="useSuggestion('Optimize this database query for better performance')">Optimize code</div>
                    </div>
                </div>
            `;
            lastResponse = '';
        }

        // Copy last response
        function copyLastResponse() {
            if (!lastResponse) {
                alert('No response to copy yet!');
                return;
            }
            
            navigator.clipboard.writeText(lastResponse).then(() => {
                alert('Response copied to clipboard! ✅');
            }).catch(err => {
                alert('Failed to copy: ' + err);
            });
        }

        // Handle Enter key
        document.getElementById('chat-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Initialize on load
        window.addEventListener('load', initPuter);
    </script>
</body>
</html>
